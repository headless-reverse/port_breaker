<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>PortBreaker Web Interface (USB Control)</title>
    <style>
        /* CSS DLA INTERFEJSU */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #222; color: #f0f0f0; margin: 0; padding: 20px; }
        #container { max-width: 1200px; margin: 0 auto; background-color: #333; padding: 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); }
        h1 { color: #8ECAE6; border-bottom: 2px solid #444; padding-bottom: 10px; }        
        #main-layout { display: flex; gap: 20px; margin-top: 20px; }        
        /* Panel sterowania */
        #control-panel { flex: 1; min-width: 250px; max-width: 300px; }
        button { 
            width: 100%; 
            padding: 10px 15px; 
            margin-bottom: 8px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button:hover:not(:disabled) { opacity: 0.9; }
        .btn-green { background-color: #98c379; color: #1e2127; }
        .btn-red { background-color: #e06c75; color: #1e2127; }
        .btn-blue { background-color: #61afef; color: #1e2127; }
        .btn-orange { background-color: #e6c07b; color: #1e2127; }
        /* Tabela urzadzen */
        #device-table-container { flex: 3; }
        #device-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        #device-table th { background-color: #555; padding: 10px; text-align: left; position: sticky; top: 0; z-index: 10;}
        #device-table td { padding: 8px 10px; border-bottom: 1px solid #444; }
        #device-table tbody tr { cursor: pointer; transition: background-color 0.1s; }
        #device-table tbody tr:hover { background-color: #444; }        
        /* Status w tabeli */
        .status-active { background-color: #006400 !important; color: white; }
        .status-disabled { background-color: #8B0000 !important; color: white; }
        .status-na { background-color: #505050 !important; color: white; }
        .status-wakeup-en { background-color: #1E50A0 !important; color: white; }
        .status-wakeup-dis { background-color: #96501E !important; color: white; }        
        /* Logi */
        #log-output { height: 200px; background-color: #000; border: 1px solid #444; overflow-y: scroll; padding: 10px; font-family: monospace; font-size: 13px; margin-top: 20px;}
        .log-line { margin: 0; padding: 2px 0; }
        .log-info { color: #56b6c2; }
        .log-error { color: #e06c75; }
        .selected-row { background-color: #4a4a4a; outline: 2px solid #61afef; }
    </style>
</head>
<body>

<div id="container">
    <h1>PortBreaker USB Control 🔌</h1>
    
    <p>Status: <span id="connectionStatus" style="color:#e06c75;">Rozłączono</span> | 
        Wybrane VID:PID: <span id="selectedVidPid">N/A</span> | 
        Ścieżka Sysfs: <span id="selectedSysfsPath">N/A</span>
    </p>

    <div id="main-layout">
        
        <div id="control-panel">
            <h3>Akcje Urządzenia</h3>

            <div style="display: flex; gap: 5px; align-items: center; margin-bottom: 8px;">
                <label for="timerSpinBox" style="flex-shrink: 0; font-size: 14px;">Czas (sek):</label>
                <input type="number" id="timerSpinBox" value="5" min="1" style="flex-grow: 1; padding: 8px; border-radius: 4px; border: 1px solid #555; background-color: #444; color: #f0f0f0;">
            </div>
            <button class="btn-red" id="disableWithTimerBtn" disabled>Wyłącz z Timerem</button>
            
            <button class="btn-green" id="enableBtn" disabled>Włącz (Sysfs)</button>
            <button class="btn-red" id="disableBtn" disabled>Wyłącz (Sysfs)</button>
            <button class="btn-blue" id="resetSysfsBtn" disabled>Resetuj (Sysfs)</button>
            <button class="btn-blue" id="resetIoctlBtn" disabled>Resetuj (ioctl)</button>
            <button class="btn-orange" id="toggleWakeupBtn" disabled>Wł/Wył Wake-up</button>
            
            <h3 style="margin-top: 20px;">Akcje Globalne</h3>
            <button class="btn-red" id="resetAllBtn" disabled>Resetuj wszystkie kontrolery</button>
            <button class="btn-green" id="refreshBtn">Odśwież listę</button>
            
            <div style="margin-top: 15px;">
                <input type="checkbox" id="showAllDevicesCheckbox">
                <label for="showAllDevicesCheckbox">Pokaż wszystkie fake_sys</label>
            </div>
        </div>
        
        <div id="device-table-container">
            <h3>Lista Urządzeń USB</h3>
            <table id="device-table">
                <thead>
                    <tr>
                        <th style="width: 100px;">VID:PID</th>
                        <th>Nazwa Urządzenia</th>
                        <th style="width: 100px;">Status</th>
                        <th style="width: 100px;">Wake-up</th>
                        <th style="width: 250px;">Sysfs Path</th>
                    </tr>
                </thead>
                <tbody id="device-table-body">
                    <tr><td colspan="5" style="text-align: center;">Łączenie z serwerem...</td></tr>
                </tbody>
            </table>
        </div>
        
    </div>
    
    <div id="log-output"></div>
</div>

<script>
// NR PORT
    const WS_PORT = 7678;
    const socketUrl = `ws://${window.location.hostname || 'localhost'}:${WS_PORT}`;    
    const statusSpan = document.getElementById('connectionStatus');
    const outputDiv = document.getElementById('log-output');
    const tableBody = document.getElementById('device-table-body');
    const selectedVidPidSpan = document.getElementById('selectedVidPid');
    const selectedSysfsPathSpan = document.getElementById('selectedSysfsPath');
    const timerSpinBox = document.getElementById('timerSpinBox');
    const showAllDevicesCheckbox = document.getElementById('showAllDevicesCheckbox');    
    let ws;
    let currentDevices = []; 
    let selectedVidPid = null;
    let selectedSysfsPath = null;    
    const controlButtons = [
        document.getElementById('enableBtn'),
        document.getElementById('disableBtn'),
        document.getElementById('resetSysfsBtn'),
        document.getElementById('resetIoctlBtn'),
        document.getElementById('toggleWakeupBtn'),
        document.getElementById('resetAllBtn'),
        document.getElementById('refreshBtn'),
        document.getElementById('disableWithTimerBtn')
    ];
    function appendLog(message, className) {
        const line = document.createElement('p');
        line.className = 'log-line ' + className;
        line.textContent = message;
        outputDiv.appendChild(line);
        outputDiv.scrollTop = outputDiv.scrollHeight;
    }
    function sendCommand(type, vidPid = null, sysfsPath = null, extraParams = {}) {
        if (ws.readyState !== WebSocket.OPEN) {
            appendLog("Błąd: Połączenie WS niegotowe.", "log-error");
            return false;
        }
        const payload = { type: type, ...extraParams };
        if (vidPid) payload.vid_pid = vidPid;
        if (sysfsPath) payload.sysfs_path = sysfsPath;
        const jsonMsg = JSON.stringify(payload);
        ws.send(jsonMsg);
        appendLog(`WS >>> ${type} (cel: ${vidPid || sysfsPath || 'Globalne'})`, "log-info");
        return true;
    }    
    function setControlButtonsState(disabled) {
        controlButtons.forEach(btn => {
            if (btn.id !== 'resetAllBtn' && btn.id !== 'refreshBtn') {
                btn.disabled = disabled;
            }
        });
        document.getElementById('resetAllBtn').disabled = false;
        document.getElementById('refreshBtn').disabled = false;
    }
    function renderDevices(devices) {
        tableBody.innerHTML = '';
        currentDevices = devices;        
        if (devices.length === 0) {
              tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Nie znaleziono urządzeń USB z ścieżką Sysfs.</td></tr>';
              return;
        }
        devices.forEach((dev, index) => {
            const tr = document.createElement('tr');
            tr.dataset.index = index;
            tr.dataset.vidpid = dev.vid_pid;
            tr.dataset.sysfspath = dev.sysfs_path;
            const statusClass = dev.status === "Aktywny" ? "status-active" : (dev.status === "Wylaczony" ? "status-disabled" : "status-na");
            const wakeupClass = dev.wakeup === "enabled" ? "status-wakeup-en" : (dev.wakeup === "disabled" ? "status-wakeup-dis" : "status-na");            
            const rowData = [
                dev.vid_pid, 
                dev.name, 
                `<span class="status-cell ${statusClass}">${dev.status}</span>`,
                `<span class="status-cell ${wakeupClass}">${dev.wakeup}</span>`,
                dev.sysfs_path
            ];
            rowData.forEach((data, colIndex) => {
                const td = document.createElement('td');
                td.innerHTML = data;
                if (colIndex === 2 || colIndex === 3) {
                    const span = td.querySelector('span');
                    if(span) {
                        span.style.display = 'block';
                        span.style.textAlign = 'center';
                        span.style.padding = '4px 0';
                        span.style.borderRadius = '2px';
                    }
                }
                tr.appendChild(td);
            });            
            tr.addEventListener('click', () => {
                document.querySelectorAll('#device-table-body tr').forEach(row => row.classList.remove('selected-row'));
                tr.classList.add('selected-row');
                selectedVidPid = dev.vid_pid;
                selectedSysfsPath = dev.sysfs_path;
                selectedVidPidSpan.textContent = selectedVidPid;
                selectedSysfsPathSpan.textContent = selectedSysfsPath;
                setControlButtonsState(false);
            });            
            tableBody.appendChild(tr);
        });
        if (selectedSysfsPath) {
            const row = document.querySelector(`[data-sysfspath="${selectedSysfsPath}"]`);
            if (row) {
                row.click();
            } else {
                selectedVidPid = null;
                selectedSysfsPath = null;
                selectedVidPidSpan.textContent = "N/A";
                selectedSysfsPathSpan.textContent = "N/A";
                setControlButtonsState(true);
            }
        }
    }
    function connectWebSocket() {
        if (ws) ws.close();
        ws = new WebSocket(socketUrl);        
        statusSpan.textContent = "Łączenie...";
        statusSpan.style.color = "orange";
        setControlButtonsState(true);
        ws.onopen = () => {
            statusSpan.textContent = "Połączono";
            statusSpan.style.color = "#98c379";
            appendLog(`[WS] Połączono z PortBreaker Server na ${socketUrl}`, "log-info");
            setControlButtonsState(false);
            sendCommand('GET_DEVICES');
        };
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === "DEVICES_LIST" && data.data) {
                    renderDevices(data.data);
                    appendLog(`[Server] Otrzymano listę ${data.data.length} urządzeń.`, "log-info");
                } else if (data.type === "ACK") {
                    appendLog(`[Server OK] ${data.message}`, data.success ? "log-info" : "log-error");
                    sendCommand('GET_DEVICES');
                } else if (data.type === "STATUS") {
                    appendLog(`[Server Status] ${data.message}`, "log-info");
                } else if (data.type === "ERROR") {
                     appendLog(`[Server ERROR] ${data.message}`, "log-error");
                } 
            } catch (e) {
                appendLog(`[WS ERROR] Błąd przetwarzania wiadomości: ${event.data}`, "log-error");
            }
        };
        ws.onclose = () => {
            statusSpan.textContent = "Rozłączono (Próba ponownego połączenia za 3s...)";
            statusSpan.style.color = "#e06c75";
            setControlButtonsState(true);
            setTimeout(connectWebSocket, 3000);
        };
    }    
    document.getElementById('refreshBtn').addEventListener('click', () => sendCommand('GET_DEVICES'));
    document.getElementById('enableBtn').addEventListener('click', () => {
        if (selectedSysfsPath) sendCommand('ENABLE', null, selectedSysfsPath);
    });
    document.getElementById('disableBtn').addEventListener('click', () => {
        if (selectedSysfsPath) sendCommand('DISABLE', null, selectedSysfsPath);
    });    
    document.getElementById('disableWithTimerBtn').addEventListener('click', () => {
        const timerValue = parseInt(timerSpinBox.value) || 5; 
        if (selectedSysfsPath) {
            sendCommand('DISABLE_TIMER', null, selectedSysfsPath, { seconds: timerValue });
        } else {
            appendLog("Błąd: Wybierz urządzenie do wyłączenia z timerem.", "log-error");
        }
    });
    document.getElementById('resetSysfsBtn').addEventListener('click', () => {
        if (selectedSysfsPath) sendCommand('RESET_SYSFS', null, selectedSysfsPath);
    });
    document.getElementById('resetIoctlBtn').addEventListener('click', () => {
        if (selectedVidPid && selectedVidPid !== "N/A") sendCommand('RESET_IOCTL', selectedVidPid);
        else appendLog("Błąd: Reset ioctl wymaga VID:PID.", "log-error");
    });
    document.getElementById('resetAllBtn').addEventListener('click', () => {
        if (confirm("Czy na pewno zresetować WSZYSTKIE kontrolery hosta USB? Ta akcja może odłączyć wszystkie urządzenia USB.")) {
            sendCommand('RESET_ALL');
        }
    });
    document.getElementById('toggleWakeupBtn').addEventListener('click', () => {
        if (selectedSysfsPath) sendCommand('TOGGLE_WAKEUP', null, selectedSysfsPath);
    });
    showAllDevicesCheckbox.addEventListener('change', () => {
        const command = showAllDevicesCheckbox.checked ? 'SET_FILTER_ALL' : 'SET_FILTER_DEFAULT';
        sendCommand(command);
        appendLog(`[GUI] Zmieniono filtr urządzeń. Nowy stan: ${showAllDevicesCheckbox.checked ? 'Pokaż wszystkie' : 'Domyślny'}.`, "log-info");
        setTimeout(() => sendCommand('GET_DEVICES'), 100); 
    });
    connectWebSocket();
</script>

</body>
</html>
